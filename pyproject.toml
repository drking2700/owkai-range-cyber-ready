[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-cyber-ready-range"
version = "0.1.0"
description = "AI-native, human-accountable cybersecurity training range"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
range = "range_app.cli:main"

[tool.setuptools.packages.find]
include = ["range_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
